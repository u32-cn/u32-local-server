# 发版自动化：push 形如 v*.*.* 的 tag → 构建 Windows 免 Node 安装包 → 创建 GitHub Release 并上传
# 产物固定可下载地址：https://github.com/<owner>/<repo>/releases/latest/download/u32-local-server-setup-<版本>.exe
# SEA 不支持交叉编译，runner 用的就是 windows-latest（Windows 本平台构建）
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # 创建 Release 与上传资产需要写权限

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # tag 必须与 package.json version 一致（v1.7.1 ↔ 1.7.1），不一致直接失败
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$pkgVersion") {
            Write-Error "tag '$tag' 与 package.json version '$pkgVersion' 不一致"
            exit 1
          }
          Write-Host "版本校验通过：$tag == v$pkgVersion"

      # lock 文件的 resolved 指向阿里云私有 registry（带 token，runner 无凭证），显式改用 npmjs 公共源
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build icons
        run: node scripts/build-icon.js

      - name: Build SEA executable
        run: node scripts/build-sea.js

      # 本地构建用 .vtxf/tools/inno6（gitignore，不在 runner 上）；choco 装 Inno Setup 6，ISCC 在 PATH
      - name: Install Inno Setup
        run: choco install innosetup --noprogress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "ISCC.exe" }
          & $iscc scripts/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      # installer.iss 的 AppVersion 是写死的，校验产物文件名与 tag 对齐，防止未来忘改
      - name: Verify installer exists
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "dist/u32-local-server-setup-$($tag.TrimStart('v')).exe"
          if (-not (Test-Path $exe)) {
            Write-Error "未找到安装包 $exe"
            exit 1
          }
          Write-Host "安装包就绪：$exe"

      # Release notes 取 CHANGELOG 中该版本段（## [X.Y.Z] 到下一个 ## 之间）
      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = -1; $end = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i] -match "^## \[$version\]") { $start = $i; continue }
            if ($start -ge 0 -and $i -gt $start -and $lines[$i] -match '^## \[') { $end = $i; break }
          }
          if ($start -lt 0) { Write-Error "CHANGELOG 中找不到 [$version] 段"; exit 1 }
          if ($end -lt 0) { $end = $lines.Count }
          $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          Write-Host "----- release notes -----"
          Write-Host $notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "dist/u32-local-server-setup-$($tag.TrimStart('v')).exe"
          gh release create $tag $exe `
            --repo "${{ github.repository }}" `
            --title $tag `
            --notes-file release-notes.md `
            --latest

      # 官网下载走 EdgeOne 直链回源 Releases（/download/win/* 路径规则），exe 不进仓库；
      # 这里只提交 latest.yml 版本元数据（Pages 伺服，官网按钮读它显示版本号与直链文件名）。
      # push 到 main 触发 Pages 重新发布。
      - name: Publish latest.yml to Pages
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $exe = "dist/u32-local-server-setup-$version.exe"
          $size = (Get-Item $exe).Length
          # sha256 供完整性校验（latest.yml 格式对齐 git-notes）
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $yml = "version: $version`npath: download/win/u32-local-server-setup-$version.exe`nfiles:`n  - url: u32-local-server-setup-$version.exe`n    size: $size`n    sha256: $sha`n"
          New-Item -ItemType Directory -Force -Path docs/data/win | Out-Null
          $yml | Out-File -FilePath docs/data/win/latest.yml -Encoding utf8NoBOM
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/win/latest.yml
          git commit -m "chore(release): update latest.yml for $version" --no-verify
          # tag 触发的 checkout 处于 detached HEAD，必须显式推 refs/heads/main
          git push origin HEAD:refs/heads/main

      - name: Wait for Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}   # 轮询 pages builds API 必需，缺失时状态恒为空
        shell: pwsh
        run: |
          # 等 Pages 部署完成（最长 5 分钟），保证下载直链即刻可用
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 10
            $page = gh api repos/${{ github.repository }}/pages/builds/latest --jq '.status' 2>$null
            Write-Host "pages build status: $page"
            if ($page -eq 'built') { $ok = $true; break }
          }
          if (-not $ok) { Write-Warning 'Pages 部署状态未确认（非致命，直链稍后自动可用）' }

  # npm 发布：tag 校验已在上一个 job 完成，这里复用 checkout 直接 publish
  # 依赖仓库 secret NPM_TOKEN（Automation 类型 token，npmjs → Access Tokens 生成）
  publish-npm:
    runs-on: ubuntu-latest
    needs: build-and-release   # 安装包发布成功后再发 npm，任一失败不单独出包
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
