  </symbol>

  <symbol id="i-back" viewBox="0 0 16 16">
    <path d="M10.5 3 5.5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-forward" viewBox="0 0 16 16">
    <path d="M5.5 3 10.5 8l-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-up" viewBox="0 0 16 16">
    <path d="M8 13V3.5M4 7.5 8 3.4l4 4.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-refresh" viewBox="0 0 16 16">
    <path d="M13 8a5 5 0 1 1-1.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M12.4 2.4v2.6h-2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-search" viewBox="0 0 16 16">
