    <path d="M10.2 10.2 13.4 13.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-chevron-down" viewBox="0 0 16 16">
    <path d="M4 6.4 8 10.4l4-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-sort-up" viewBox="0 0 16 16">
