<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Win 风格图标雪碧图：注入文档后由 <use href="#i-xxx"> 引用；功能图标用 currentColor 随前景色 -->

  <symbol id="i-folder" viewBox="0 0 16 16">
    <path d="M1 3.5C1 2.7 1.6 2 2.4 2H6l1.5 1.5h6.1c.8 0 1.4.7 1.4 1.5v7.5c0 .8-.6 1.5-1.4 1.5H2.4A1.4 1.4 0 0 1 1 12.5z" fill="#e8a93c"/>
    <path d="M1 4.6h14v7.9c0 .8-.6 1.5-1.4 1.5H2.4A1.4 1.4 0 0 1 1 12.5z" fill="#ffd04b"/>
    <path d="M1 6.2h14v6.3c0 .8-.6 1.5-1.4 1.5H2.4A1.4 1.4 0 0 1 1 12.5z" fill="#ffe07a"/>
  </symbol>

  <symbol id="i-folder-addr" viewBox="0 0 16 16">
    <path d="M1 3.2c0-.7.6-1.2 1.3-1.2H6l1.4 1.4h6.3c.7 0 1.3.6 1.3 1.3v8c0 .7-.6 1.3-1.3 1.3H2.3c-.7 0-1.3-.6-1.3-1.3z" fill="#f0b429"/>
    <path d="M1 5h14v7.7c0 .7-.6 1.3-1.3 1.3H2.3c-.7 0-1.3-.6-1.3-1.3z" fill="#ffd968"/>
  </symbol>

  <symbol id="i-file" viewBox="0 0 16 16">
    <path d="M3 1.5h6.5L13 5.2v9.3c0 .6-.5 1-1 1H4c-.6 0-1-.4-1-1z" fill="#fff" stroke="#b7b7b7" stroke-width="1"/>
    <path d="M9.5 1.5V5h3.5" fill="#e6e6e6" stroke="#b7b7b7" stroke-width="1"/>
    <path d="M5 7.2h6M5 9.2h6M5 11.2h4" stroke="#9c9c9c" stroke-width=".9" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-file-exe" viewBox="0 0 16 16">
    <rect x="2.5" y="1.5" width="11" height="13" rx="1" fill="#5b8fd6"/>
    <rect x="4" y="3.2" width="8" height="5.6" rx=".4" fill="#eef4fc"/>
    <rect x="4" y="3.2" width="8" height="1.6" rx=".4" fill="#3a6fb8"/>
    <path d="M4.4 11h2M7.2 11h2M10 11h1.4" stroke="#dce9fa" stroke-width="1" stroke-linecap="round"/>
    <circle cx="12" cy="12.2" r="1.4" fill="#7fc35a" stroke="#fff" stroke-width=".6"/>
  </symbol>

  <symbol id="i-drive" viewBox="0 0 16 16">
    <rect x="1.5" y="5" width="13" height="6" rx="1" fill="#d9d9d9" stroke="#a8a8a8" stroke-width=".8"/>
    <rect x="1.5" y="5" width="13" height="2.4" rx="1" fill="#efefef"/>
    <circle cx="12.2" cy="9.6" r="1.1" fill="#57c257" stroke="#3a9b3a" stroke-width=".5"/>
    <path d="M3.2 9.4h4" stroke="#8f8f8f" stroke-width=".9" stroke-linecap="round"/>
  </symbol>

