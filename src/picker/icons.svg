  </symbol>

  <symbol id="i-sort-down" viewBox="0 0 16 16">
    <path d="M8 11.6 4.4 7h7.2z" fill="currentColor"/>
  </symbol>

  <symbol id="i-window" viewBox="0 0 16 16">
    <rect x="2" y="2.5" width="12" height="11" rx="1" fill="#fff" stroke="#6c6c6c" stroke-width="1"/>
    <path d="M2 5.2h12" stroke="#6c6c6c" stroke-width="1"/>
    <rect x="2.6" y="3" width="1" height="1" fill="#6c6c6c"/>
  </symbol>

  <symbol id="i-info" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="14" fill="#0b6fc9"/>
    <path d="M16 13.4a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2zM16 15v9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
